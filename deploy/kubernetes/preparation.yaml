apiVersion: v1
kind: Namespace
metadata:
  name: kazstyle-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preparation
  namespace: kazstyle-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kazstyle-preparation
  template:
    metadata:
      labels:
        app: kazstyle-preparation
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preparation
          image: kazstyle-preparation:ci
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: preparation
  namespace: kazstyle-demo
spec:
  selector:
    app: kazstyle-preparation
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP

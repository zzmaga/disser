services:
  preparation:
    build:
      context: .
      target: runtime
    image: kazstyle-preparation:local
    ports:
      - "127.0.0.1:8085:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 256m
